[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skillforge"
version = "1.0.0"
description = "1,026 lazy-loading AI skills for Claude, Gemini, and Scientific agents"
readme = "../README.md"
license = { text = "MIT" }
authors = [{ name = "Lord1Egypt", email = "akim.221992@gmail.com" }]
keywords = ["ai", "skills", "claude", "gemini", "agents", "prompts", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/Lord1Egypt/ai-skillforge"
Repository = "https://github.com/Lord1Egypt/ai-skillforge"
Issues = "https://github.com/Lord1Egypt/ai-skillforge/issues"

[project.scripts]
skillforge = "agent_skillforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_skillforge*"]

[tool.setuptools.package-data]
agent_skillforge = ["index.json", "skills/**/*"]
